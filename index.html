<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitalhealth — materiály</title>
<style>
  :root{
    --bg:#f7f6f3;
    --surface:#ffffff;
    --border:#e1ded6;
    --text:#1f1e1c;
    --text-secondary:#6b6a65;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    padding:48px 16px;
  }
  .wrap{max-width:480px;margin:0 auto;}
  h1{font-size:20px;font-weight:600;margin:0 0 8px;}
  p{color:var(--text-secondary);font-size:14px;line-height:1.5;margin:0 0 24px;}
  a{
    display:block;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    color:var(--text);
    text-decoration:none;
    font-weight:500;
  }
  a span{display:block;font-weight:400;font-size:13px;color:var(--text-secondary);margin-top:4px;}
  a:hover{border-color:#b4b2a9;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Vitalhealth</h1>
  <p>Projektové materiály na zdieľanie.</p>
  <a href="sitemapa-a-flow.html">
    Sitemapa a flow
    <span>Domovská stránka, hlavný protokol a vetva obchodu</span>
  </a>
  <a href="prototyp.html">
    Low-fi prototyp (mobile-first)
    <span>Klikateľný wireframe — 13 obrazoviek</span>
  </a>
</div>
</body>
</html>
